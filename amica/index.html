<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Amica is your personal 3D companion that can communicate via natural voice chat and vision, with an emotion engine that allows Amica to express feelings, complete tasks and engage on her own." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Amica - Where Empathy Meets AI" />
    <meta property="og:description" content="Amica is your personal 3D companion that can communicate via natural voice chat and vision, with an emotion engine that allows Amica to express feelings, complete tasks and engage on her own." />
    <meta property="og:image" content="https://amica.arbius.ai/ogp.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Amica - Where Empathy Meets AI" />
    <meta property="twitter:description" content="Amica is your personal 3D companion that can communicate via natural voice chat and vision, with an emotion engine that allows Amica to express feelings, complete tasks and engage on her own." />
    <meta property="twitter:image" content="https://amica.arbius.ai/ogp.png" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="application-name" content="Amica - Where Empathy Meets AI" />
    <meta name="apple-mobile-web-app-title" content="Amica - Where Empathy Meets AI" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=M+PLUS+2&family=Montserrat&display=swap"
      rel="stylesheet"
    />

    <title>Amica - Where Empathy Meets AI</title>

    <!-- Critical scripts that need to load before app -->
    <script src="/debugLogger.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Initial loading overlay (shown before React renders) -->
    <div id="initial-loading" style="
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom right, white, rgb(249, 250, 251), rgb(243, 244, 246));
      z-index: 9999;
      font-family: 'Fredoka', sans-serif;
    ">
      <div style="width: 100%; max-width: 600px; padding: 0 2rem;">
        <div style="color: rgb(31, 41, 55); font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; font-weight: bold;">
          Loading configuration...
        </div>
        <div style="width: 100%; background: rgb(229, 231, 235); border-radius: 1rem; height: 2.5rem; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border: 2px solid rgb(209, 213, 219);">
          <div style="background: linear-gradient(to right, rgb(34, 211, 238), rgb(59, 130, 246), rgb(37, 99, 235)); height: 100%; border-radius: 0.75rem; width: 5%; transition: width 0.5s ease-out;">
          </div>
        </div>
        <div style="color: rgb(17, 24, 39); font-size: 1.5rem; margin-top: 1rem; text-align: center; font-weight: bold;">
          5%
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
